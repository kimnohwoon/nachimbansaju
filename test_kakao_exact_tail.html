<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { background: #a9bdce; padding: 30px; }
.bubble-box {
  position: relative;
  background: #ffffff;
  border-radius: 13px;
  padding: 12px 14px;
  width: 320px;
  font-family: -apple-system, sans-serif;
  font-size: 14.5px;
  line-height: 1.5;
  box-shadow: 0 1px 1px rgba(0,0,0,0.05);
}
.kakao-beak-svg {
  position: absolute;
  top: 0;
  left: -6.5px;
  width: 8px;
  height: 14px;
  display: block;
}
</style>
</head>
<body>
<div class="bubble-box">
  <svg class="kakao-beak-svg" viewBox="0 0 8 14">
    <!-- Path: Tip at (0, 3), valley curves to (8, 0), bottom curves to (7, 14) -->
    <path d="M 0,3 
             C 2,1 5,0 8,0 
             L 8,14 
             C 6,10 3,6 0,3 Z" fill="#ffffff"/>
  </svg>
  상담 받고 정말 마음이 안정됐어요..<br>
  그동안 너무 불안하고 답답한 상황이었는데 혼자서는 해결방법을 못찾겠더라구요ㅠㅠ
</div>
</body>
</html>
